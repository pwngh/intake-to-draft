[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intake-to-draft"
version = "0.1.0"
description = "Invented intake and reference contracts for a demonstration drafting workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.163.1",
  "pydantic==2.14.3",
  "uvicorn==0.54.0",
  "langgraph==1.2.22",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langsmith==0.15.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.2.0"]
retrieval = ["onnxruntime==1.32.0", "tokenizers==0.23.3", "numpy==2.5.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intake_draft = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
